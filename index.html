<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App.enc Direct Host</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h1 { color: #58a6ff; font-size: 22px; margin-bottom: 12px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }
        .btn:hover { background-color: #2ea043; }
        .file-info {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
            background: #21262d;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>App File Loader</h1>
        <p>Niche button par click karke direct file load/download karein.</p>
        
        <!-- Direct Link to your app.enc file -->
        <a href="app.enc" download="app.enc" class="btn">Load app.enc</a>

        <div class="file-info">Target File: <strong>app.enc</strong></div>
    </div>
</body>
</html>
