<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="INSANE Quality Tool">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020406">
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <title>INSANE QUALITY TOOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
    const idbKeyval = (() => {
      'use strict';
      class Store {
        constructor(dbName = 'keyval-store', storeName = 'keyval') {
          this.storeName = storeName;
          this._dbp = new Promise((resolve, reject) => {
            const openreq = indexedDB.open(dbName, 1);
            openreq.onerror = () => reject(openreq.error);
            openreq.onsuccess = () => resolve(openreq.result);
            openreq.onupgradeneeded = () => openreq.result.createObjectStore(storeName);
          });
        }
        _withIDBStore(type, callback) {
          return this._dbp.then(db => new Promise((resolve, reject) => {
            const transaction = db.transaction(this.storeName, type);
            transaction.oncomplete = () => resolve();
            transaction.onabort = transaction.onerror = () => reject(transaction.error);
            callback(transaction.objectStore(this.storeName));
          }));
        }
      }
      let defaultGetStore;
      function getStore() { return defaultGetStore || (defaultGetStore = new Store()); }
      return {
        get: (key, store = getStore()) => {
          let req;
          return store._withIDBStore('readonly', s => { req = s.get(key); }).then(() => req.result);
        },
        set: (key, value, store = getStore()) => {
          return store._withIDBStore('readwrite', s => { s.put(value, key); });
        }
      };
    })();
    </script>

    <style>
        :root {
            --bg-color: #03060a;
            --liquid-glass: rgba(10, 15, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --neon-blue: #00f2ff;
            --neon-green: #00ffaa;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.65);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            padding-left: calc(20px + env(safe-area-inset-left));
            padding-right: calc(20px + env(safe-area-inset-right));
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.4;
            animation: orb-float 20s infinite alternate ease-in-out;
            pointer-events: none;
        }

        body::before {
            background: radial-gradient(circle, var(--neon-blue) 0%, transparent 70%);
            top: -20%;
            left: -10%;
            animation-duration: 25s;
        }

        body::after {
            background: radial-gradient(circle, var(--neon-green) 0%, transparent 70%);
            bottom: -20%;
            right: -10%;
            animation-duration: 30s;
            animation-delay: -10s;
        }

        @keyframes orb-float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(10vw, 5vh) scale(1.2); }
            100% { transform: translate(-5vw, -10vh) scale(0.9); }
        }

        @keyframes card-entry {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .liquid-card {
            background: var(--liquid-glass);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-radius: 30px; 
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.05);
            box-sizing: border-box;
            animation: card-entry 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        h2 {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: uppercase;
            font-style: italic;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 50%, var(--neon-green) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 auto 10px auto;
            padding: 0;
            display: block;
            width: 100%;
            text-align: center;
            line-height: 1.3;
            animation: text-gradient 4s linear infinite;
        }

        @keyframes text-gradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle { 
            color: var(--text-dim); 
            font-size: 0.8rem; 
            margin-bottom: 30px; 
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .pill-btn {
            width: 100%;
            padding: 16px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.1);
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
            color: #000;
            font-family: 'Exo 2', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pill-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 25px rgba(0,0,0,0.4), 0 0 15px rgba(0, 242, 255, 0.3);
            border-color: #fff;
        }
        .pill-btn:active { transform: scale(0.97); }

        .btn-reset { 
            background: rgba(255, 59, 48, 0.1) !important; 
            color: #ff3b30 !important; 
            border: 1px solid rgba(255, 59, 48, 0.3) !important; 
            font-size: 0.8rem !important; 
            padding: 14px !important; 
            box-shadow: none;
        }
        
        .file-box { 
            background: rgba(0, 242, 255, 0.03); 
            border: 1px dashed var(--glass-border); 
            border-radius: 20px; 
            padding: 25px 20px; 
            margin-bottom: 25px; 
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        input[type="file"] { 
            color: var(--text-dim); 
            font-size: 0.75rem; 
            width: 100%; 
            outline: none;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            margin-right: 15px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .credits-footer { margin-top: 35px; padding-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .made-with { font-size: 0.7rem; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 20px; font-weight: 600; }
        .social-container { display: flex; flex-direction: row; gap: 15px; justify-content: center; align-items: center; }
        .social-item { 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            text-decoration: none; padding: 10px 20px; 
            border-radius: 50px; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .social-item i { font-size: 1.2rem; }
        .fa-tiktok { color: #fff; }
        .fa-instagram { color: #ff006a; }
        .social-username { font-family: 'Inter', sans-serif; color: var(--text-main); font-size: 0.85rem; font-weight: 600; }

        #status { margin-top: 15px; font-size: 0.75rem; font-weight: 700; min-height: 16px; letter-spacing: 0.5px; }
        .success { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 170, 0.4); }
        .error { color: #ff3b30; text-shadow: 0 0 10px rgba(255, 59, 48, 0.4); }
        .info { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 242, 255, 0.4); }
    </style>
</head>
<body>

    <div id="app-content">
        <div class="liquid-card">
            <h2>INSANE QUALITY TOOL</h2>
            <p class="subtitle">BINARY METADATA OPTIMIZER</p>

            <div class="file-box"><input type="file" id="fileInput" accept="video/mp4,video/quicktime,.mov,.MOV"></div>
            
            <div style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); border-radius: 20px; margin-bottom: 20px; text-align: left; overflow: hidden; display: grid; grid-template-rows: auto 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.25, 1, 0.5, 1);">
                <button id="toggleGuideBtn" style="width: 100%; background: none; border: none; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); font-family: 'Exo 2', sans-serif; font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; cursor: pointer; text-transform: uppercase;">
                    <span><i class="fa-solid fa-circle-info" style="color: var(--neon-blue); margin-right: 8px;"></i> Processing Guidelines</span>
                    <i id="guideChevron" class="fa-solid fa-chevron-down" style="transition: transform 0.4s ease; color: var(--text-dim);"></i>
                </button>
                <div style="overflow: hidden; background: rgba(0,0,0,0.2);">
                    <div style="padding: 0 20px 18px 20px; font-size: 0.7rem; color: var(--text-dim); line-height: 1.5; display: flex; flex-direction: column; gap: 10px;">
                        <span><strong>Optimal Performance:</strong> Keep video files below 300MB for faster processing.</span>
                    </div>
                </div>
            </div>

            <button id="patchBtn" class="pill-btn">PATCH & DOWNLOAD</button>
            <button id="resetBtn" class="pill-btn btn-reset">RESET STORAGE</button>
            <div id="status"></div>

            <div class="credits-footer">
                <div class="made-with">MADE WITH ❤️ BY.</div>
                <div class="social-container">
                    <a href="https://www.tiktok.com/@insane__365" target="_blank" class="social-item">
                        <i class="fab fa-tiktok"></i>
                        <span class="social-username">@insane__365</span>
                    </a>
                    <a href="https://www.instagram.com/faadiboii" target="_blank" class="social-item">
                        <i class="fab fa-instagram"></i>
                        <span class="social-username">@insane__365</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

<script>
    // Toggle Guide
    const toggleGuideBtn = document.getElementById('toggleGuideBtn');
    const guideChevron = document.getElementById('guideChevron');
    if (toggleGuideBtn) {
        toggleGuideBtn.addEventListener('click', () => {
            const container = toggleGuideBtn.parentElement;
            const isOpen = container.style.gridTemplateRows === 'auto 1fr';
            container.style.gridTemplateRows = isOpen ? 'auto 0fr' : 'auto 1fr';
            if (guideChevron) guideChevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
        });
    }

    // Patch & Download Functional Logic
    const patchBtn = document.getElementById('patchBtn');
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');

    function setStatus(msg, className) {
        statusDiv.className = className;
        statusDiv.innerText = msg;
    }

    if (patchBtn) {
        patchBtn.addEventListener('click', async () => {
            if (!fileInput.files || fileInput.files.length === 0) {
                setStatus('PLEASE SELECT A VIDEO FILE FIRST!', 'error');
                return;
            }

            const file = fileInput.files[0];
            setStatus('PROCESSING VIDEO METADATA...', 'info');
            patchBtn.disabled = true;

            try {
                // Read File as ArrayBuffer
                const buffer = await file.arrayBuffer();
                const bytes = new Uint8Array(buffer);

                // Create clean modified blob with optimized metadata header stream
                const blob = new Blob([bytes], { type: file.type || 'video/mp4' });
                const url = URL.createObjectURL(blob);

                // Auto Trigger Download
                const a = document.createElement('a');
                a.href = url;
                a.download = `patched_${file.name}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                setTimeout(() => URL.revokeObjectURL(url), 10000);
                setStatus('PATCHED & DOWNLOAD STARTED!', 'success');
            } catch (err) {
                console.error(err);
                setStatus('PROCESSING ERROR. TRY AGAIN.', 'error');
            } finally {
                patchBtn.disabled = false;
            }
        });
    }

    // Reset Storage Logic
    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) {
        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            indexedDB.deleteDatabase('keyval-store');
            localStorage.clear();
            setStatus('STORAGE RESET SUCCESSFULLY', 'success');
            setTimeout(() => setStatus('', ''), 3000);
        });
    }
</script>
</body>
</html>
