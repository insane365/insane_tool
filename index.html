<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App.enc Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            margin-bottom: 20px;
        }
        #content {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <button class="btn" onclick="loadFile()">Load app.enc Content</button>
    <div id="content">Click button to view content...</div>

    <script>
        function loadFile() {
            fetch('app.enc')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('content').innerText = data;
                })
                .catch(err => {
                    document.getElementById('content').innerText = 'Error loading file: ' + err;
                });
        }
    </script>
</body>
</html>
